<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap | Log In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="logo" href="login.html">Skill<span>Swap</span></a>
    <p class="tagline">Trade what you know for the help you need.</p>

    <form action="homepeygii.html" method="get">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" required>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" minlength="6" required>
      </div>

      <button type="submit">Log In</button>
    </form>

    <p class="auth-link">
      New to SkillSwap? <a href="regiter.html">Create an account</a>
    </p>
  </main>
</body>
</html>
